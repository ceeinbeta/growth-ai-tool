<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><style>:root{
  --canvas: #F3F5EE;
  --paper: #FBFCF8;
  --white: #FFFFFF;
  --ink: #17352C;
  --palette-muted: #687A72;
  --muted-text: #62746E;
  --brand-green: #39A875;
  --brand-bright: #A8E063;
  --brand-deep: #237A55;
  --line: #DCE4DA;
  --primary-hover: #9CD454;
  --radius: 1.25rem;
  --background: var(--canvas);
  --foreground: var(--ink);
  --card: var(--paper);
  --card-foreground: var(--ink);
  --popover: var(--paper);
  --popover-foreground: var(--ink);
  --primary: var(--brand-bright);
  --primary-foreground: var(--ink);
  --secondary: var(--paper);
  --secondary-foreground: var(--ink);
  --muted: var(--paper);
  --muted-foreground: var(--muted-text);
  --accent: color-mix(in srgb, var(--brand-bright) 22%, var(--canvas));
  --accent-foreground: var(--ink);
  --selected: var(--accent);
  --sunken: var(--paper);
  --signal: var(--brand-bright);
  --info: var(--brand-deep);
  --destructive: #C23B30;
  --destructive-foreground: var(--ink);
  --danger-soft: #FBE0DD;
  --warning: #B86E00;
  --warning-soft: #FDEFD2;
  --border: var(--line);
  --input: var(--line);
  --ring: var(--ink);
  --chart-other: var(--ink);
  --overlay: color-mix(in srgb, var(--ink) 80%, transparent);
  --hero-shadow: 0 1.5rem 4rem rgba(23,53,44,0.09);
  --sidebar: var(--canvas);
  --sidebar-foreground: var(--ink);
  --sidebar-primary: var(--brand-bright);
  --sidebar-primary-foreground: var(--ink);
  --sidebar-accent: var(--accent);
  --sidebar-accent-foreground: var(--ink);
  --sidebar-border: var(--line);
  --sidebar-ring: var(--ink);}</style><rect width="64" height="64" rx="16" fill="var(--paper)"/><svg x="4" y="4" width="56" height="56" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none"><path d="M46.5 21.5C42.9 16.8 37.2 14 31 14C20.5 14 12 22.5 12 33C12 43.5 20.5 52 31 52C41.5 52 50 43.5 50 33V17" stroke="var(--brand-green)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M50 17C50 25.8 42.8 33 34 33H26" stroke="var(--brand-green)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="50" cy="14" r="5" fill="var(--brand-bright)"/><circle cx="24" cy="33" r="5" fill="var(--brand-bright)"/></svg></svg>